<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm, light panel. Layers of white and warm grey for hierarchy, one orange accent for "now" and for actions, pale grey for "then". Single light theme by choice. */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --ink:#191919; --muted:#6d6d68; --line:#e3e2de;
  --accent:#d9500b; --accent-ink:#ffffff; --then:#b9b7b1; --soft:#eeedea;
  --good:#d9500b; --warn:#191919; --bad:#c0392b;
  --display:"Figtree","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:7}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em} h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wrap{max-width:1080px;width:100%;margin:0 auto;padding:0 20px 64px;min-width:0}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;min-height:100vh;padding:16px 12px 16px 0;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em;padding-left:16px}
.brand span{color:var(--accent)}
.sync{font-size:.8rem;color:var(--muted);padding-left:16px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--muted);text-decoration:none;padding:9px 12px 9px 13px;border-left:3px solid transparent;border-radius:0 5px 5px 0;white-space:nowrap}
nav a{display:flex;align-items:center;gap:10px}
nav a.on{color:var(--ink);border-color:var(--accent);background:var(--soft)}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on svg.ic{stroke:var(--accent)}
nav .sh{display:none}
nav .sep{height:1px;background:var(--line);margin:8px 0 8px 16px}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .shell{display:block}
  .side{position:static;min-height:0;padding:0;border:0;gap:0}
  .brand,.sync{display:none}
  .note{display:block}
  main{padding-top:max(14px,env(safe-area-inset-top))}
  nav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;flex-direction:row;gap:2px;padding:6px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06)}
  nav a{flex:1 1 0;min-width:0;justify-content:center;align-items:center;padding:11px 0;border:0;border-radius:22px}
  nav a.on{background:var(--soft);color:var(--accent)}
  nav svg.ic{width:25px;height:25px}
  nav .lg,nav .sh,nav .sep{display:none}
  .wrap{padding-bottom:116px}
  .stickybar{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}
}
.checkin{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
.checkin label.big{font-size:.95rem;color:var(--ink);font-weight:500;gap:6px}
.checkin .field{display:flex;align-items:baseline;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.checkin .field:focus-within{border-color:var(--accent);background:var(--surface)}
.checkin .field input{border:0;background:transparent;padding:0;width:100%;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;letter-spacing:-.02em;outline:none;-moz-appearance:textfield;appearance:textfield}
.checkin .field input::-webkit-outer-spin-button,.checkin .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.checkin .field input::placeholder{color:var(--then)}
.checkin .field em{font-style:normal;color:var(--muted);font-size:1rem}
.checkin button{padding:14px 26px;border-radius:10px;font-size:1.05rem}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.9rem}
.saved{color:var(--accent);font-weight:600}
@media (max-width:560px){.checkin{grid-template-columns:1fr 1fr}.checkin button{grid-column:1/-1}.checkin .field input{font-size:1.6rem}}
.secs{display:flex;flex-direction:column;gap:4px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 92px}
.sec .txt{padding:12px 14px 12px 0;display:flex;gap:12px;align-items:center;min-width:0}
.sec .txt svg.ic{color:var(--muted);width:22px;height:22px}
.sec .txt strong{display:block}
.sec .ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;font-size:.75rem;color:var(--muted);cursor:pointer;min-height:72px}
.sec .ctl.lock{cursor:default}
.sec .ctl span{line-height:1;white-space:nowrap}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--then);border:0;padding:0;margin:0;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:23px}
.sw:disabled{opacity:.4;cursor:default}
.banner{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-radius:4px}
.note{display:none;margin:12px 0 0;padding:8px 12px;border-radius:8px;background:var(--soft);font-size:.85rem;color:var(--ink)}
.note:empty{display:none!important}
.banner p{margin:0;flex:1 1 260px}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.tile.trend{padding:14px 14px 8px}.tile.trend svg{margin-top:8px}
.tile .k{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:3px}
.tile .t{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.delta{font-weight:600;color:var(--ink)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:5px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 8px;font-size:.85rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 8px;min-width:0;max-width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
form.row,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
form.row label{flex:1 1 110px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.muted{color:var(--muted)} .small{font-size:.85rem}
.empty{color:var(--muted);padding:16px 0;font-size:.95rem}
.pill{display:inline-block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.achieved{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.ontrack{color:var(--accent)} .pill.behind{color:var(--ink)} .pill.past{color:var(--bad)} .pill.nodata,.pill.open{color:var(--muted)}
.goal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.goal:first-of-type{border-top:0;padding-top:0}
.bar{height:10px;background:var(--soft);border-radius:99px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.weeks{display:flex;gap:4px}
.weeks span{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:600;color:var(--muted)}
.weeks span.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.weeks span.cur{border-style:dashed}
.mrow{display:grid;grid-template-columns:96px 1fr 84px;gap:8px;align-items:center;font-size:.9rem}
.mbars{display:flex;flex-direction:column;gap:2px}
.mbars i{display:block;height:8px;border-radius:2px;background:var(--accent);min-width:1px}
.mbars i.th{background:var(--then);height:5px}
.mrow .num{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}
.legend i.th{background:var(--then)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .la{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.chart .aa{fill:var(--accent);opacity:.1}
svg.chart .da{fill:var(--then);opacity:.7}
svg.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .endt{fill:var(--ink);font-weight:600;font-size:12px}
svg.chart .tg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
svg.chart .band{fill:var(--ink);opacity:.07}
svg.chart .bars rect{fill:var(--accent)} svg.chart .bars rect.cur{opacity:.5}
.ex{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:30px minmax(0,1.3fr) 10px minmax(0,1fr) 56px 42px 28px;gap:6px;align-items:center}
.set input{width:100%;text-align:center;padding:7px 2px;-moz-appearance:textfield;appearance:textfield}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
a{color:var(--accent)}
.set select{padding:7px 2px}
.set .no{font-family:var(--display);font-weight:700;font-size:1.1rem;padding:4px 0;text-align:center}
.set .ok{padding:7px 0}
.set.done .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.set.done input,.set.done select{background:var(--soft)}
.sethead{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.rest{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stickybar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.75rem}
@media (max-width:480px){.tile .v{font-size:1.55rem}.card{padding:12px}.mrow{grid-template-columns:82px 1fr 76px}}
@media (prefers-reduced-motion:no-preference){.bar i,.mbars i{transition:width .3s}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand">Gym <span>Tracker</span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="sync" id="sync">Loading</div>
</aside>
<div class="wrap"><div id="note" class="note" role="status"></div><div id="banner"></div><main id="app"></main></div>
</div>
<script>
"use strict";
/* ---------- reference data ---------- */
const MUS={chest:'Chest',back:'Back',fdelt:'Front delts',sdelt:'Side delts',rdelt:'Rear delts',bi:'Biceps',tri:'Triceps',fore:'Forearms',abs:'Abs',quads:'Quads',hams:'Hamstrings',glutes:'Glutes',calves:'Calves'};
const SITES={waist:'Waist',chest:'Chest',shoulders:'Shoulders',arm:'Upper arm',thigh:'Thigh',calf:'Calf',hips:'Hips'};
const BASE_EX=[
['bench','Bench press','chest',['fdelt','tri']],['incdb','Incline dumbbell press','chest',['fdelt','tri']],['mpress','Machine chest press','chest',['fdelt','tri']],['fly','Cable fly','chest',[]],['dips','Dips','chest',['tri','fdelt']],
['ohp','Overhead press','fdelt',['sdelt','tri']],['latr','Lateral raise','sdelt',[]],['rfly','Rear delt fly','rdelt',[]],
['pulld','Lat pulldown','back',['bi','rdelt']],['pullup','Pull-up','back',['bi','rdelt']],['row','Barbell row','back',['bi','rdelt']],['crow','Seated cable row','back',['bi','rdelt']],['csrow','Chest-supported row','back',['bi','rdelt']],
['curl','Barbell curl','bi',['fore']],['dbcurl','Dumbbell curl','bi',['fore']],['hcurl','Hammer curl','bi',['fore']],['wcurl','Wrist curl','fore',[]],
['pushd','Triceps pushdown','tri',[]],['ohext','Overhead triceps extension','tri',[]],
['squat','Back squat','quads',['glutes']],['hack','Hack squat','quads',['glutes']],['legp','Leg press','quads',['glutes']],['legx','Leg extension','quads',[]],['lunge','Walking lunge','quads',['glutes']],
['rdl','Romanian deadlift','hams',['glutes','back']],['dl','Deadlift','hams',['glutes','back']],['lcurl','Leg curl','hams',[]],['hip','Hip thrust','glutes',['hams']],
['calf','Standing calf raise','calves',[]],['scalf','Seated calf raise','calves',[]],['crunch','Cable crunch','abs',[]],['legr','Hanging leg raise','abs',[]]
].map(a=>({id:a[0],name:a[1],main:a[2],assist:a[3]}));
const CMP={7:'last week',28:'4 weeks ago',84:'12 weeks ago',365:'1 year ago'};
const TABS=[['me','Me','Me'],['body','Body','Body'],['log','Log workout','Log'],['progress','Progress','Progress'],['food','Food','Food'],['goals','Goals','Goals'],['sections','Edit sections','Edit'],['setup','Setup','Setup']];
const ICON={me:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>',
body:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10a5 5 0 0 1 8 0"/><path d="M12 11l2-2.5"/>',
log:'<path d="M6.5 7.5v9M3.5 10v4M17.5 7.5v9M20.5 10v4M6.5 12h11"/>',
progress:'<path d="M4 5v14h16"/><path d="M7.5 15l3.5-4 3 3 5-6"/>',
food:'<path d="M6 3v6a2.5 2.5 0 0 0 5 0V3M8.5 3v18"/><path d="M17 21v-8c-2.2-1-2.6-6.5 0-10z"/>',
goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
sections:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>',
setup:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.800 1.800M16.9 16.9l1.800 1.800M5.3 18.7l1.800-1.800M16.9 7.1l1.800-1.800"/>'};
const OPT={log:'Log your sets, reps and effort.',progress:'Charts of your lifts and weekly training.',food:'Protein, carbs and fat each day.',goals:'Targets you set, with progress.'};
const on=k=>k!=='none'&&(!(k in OPT)||!(S.meta.off&&S.meta.off[k]));
const NEED={e1rm:'log',sessions:'log',sets:'log',prot7:'food',protdays:'food',meas:'none'};
const goalOn=g=>{const n=NEED[g.metric.split(':')[0]];return !n||on(n)};

/* ---------- dates ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const dn=s=>{const a=s.split('-').map(Number);return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5)};
const dnIso=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const fd=s=>{const a=s.split('-').map(Number);return a[2]+' '+MON[a[1]-1]};
const fdy=s=>fd(s)+' '+s.slice(0,4);
const monday=s=>{const d=pd(s);return addD(s,-((d.getDay()+6)%7))};

/* ---------- state ---------- */
const blank=()=>({meta:{started:false,ptr:{}},sessions:[],body:{},food:{},goals:[],custom:{exercises:[],routines:[]}});
let S=blank(), demo=true, mode='loading', col=null, syncErr=false;
const ui={pendingImport:null,dataMsg:'',bodyDate:null,bodyMsg:null,cmp:28,editId:null,exSel:null,exMetric:'e1',muSel:'chest',siteSel:'waist',gType:'e1rm',gKind:'reach',allSessions:false,confirm:null,restFrom:0,exportText:''};
const uid=p=>p+'-'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allEx=()=>BASE_EX.concat(S.custom.exercises||[]);
const exBy=id=>allEx().find(e=>e.id===id)||{id,name:'Removed exercise',main:'chest',assist:[]};
const fmt=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const fl=w=>String(+Number(w||0).toFixed(2));
const sortS=()=>S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||0)-(b.start||0));

/* ---------- storage: everything stays on this device ---------- */
const KEY='gymtracker-v1';
function persist(){
  if(demo)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));mode='local'}catch(e){mode='memory'}
  paintSync();
}
const sKey=s=>'s-'+s.id;
let initDone;
async function init(){
  let loaded;
  try{const raw=localStorage.getItem(KEY);loaded=raw?Object.assign(blank(),JSON.parse(raw)):blank();localStorage.setItem('gymtracker-test','1');mode='local'}
  catch(e){loaded=blank();mode='memory'}
  if(loaded.meta&&loaded.meta.started){S=loaded;demo=false;sortS();ui.editId=null;ui.exSel=null}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
}
function applyImport(){
  const d=ui.pendingImport;if(!d)return;S=Object.assign(blank(),d);S.meta=Object.assign({ptr:{}},d.meta,{started:true});demo=false;sortS();
  ui.pendingImport=null;ui.editId=null;ui.exSel=null;ui.dataMsg='Backup restored.';persist();render();
}
/* ---------- metrics ---------- */
const work=e=>e.sets.filter(x=>x.done!==false&&x.t!=='w'&&x.r>0);
const e1=(w,r)=>r<=12?w*(1+r/30):0;
function exHist(exId){
  const out=[];
  for(const s of S.sessions)for(const e of s.ex){ if(e.exId!==exId)continue; const ws=work(e); if(!ws.length)continue;
    let best=0,top=ws[0],vol=0,reps=0;

function inRange(from,to){return S.sessions.filter(s=>s.date>=from&&s.date<=to&&s.ex.some(e=>work(e).length))}
function setsByMuscle(from,to){

    m[x.main]=(m[x.main]||0)+n;(x.assist||[]).forEach(a=>m[a]=(m[a]||0)+n*0.5)}
  return m;
}
const totalSets=(from,to)=>inRange(from,to).reduce((n,s)=>n+s.ex.reduce((k,e)=>k+work(e).length,0),0);
function avgIn(obj,field,from,to){let n=0,t=0;for(const d in obj){if(d>=from&&d<=to&&obj[d][field]!=null){n++;t+=obj[d][field]}}return n?t/n:null}
function latestMeas(site,to){let best=null;for(const d in S.body){if(d<=to&&S.body[d].m&&S.body[d].m[site]!=null&&(!best||d>best))best=d}return best?S.body[best].m[site]:null}
function valueAt(metric,D){

  return null;
}
function habitCount(metric,ws){
  const [t,arg]=metric.split(':'),we=addD(ws,6);

function lastLog(metric){

const metricUnit=m=>({e1rm:'kg',bw:'kg',meas:'cm',kcal7:'kcal',prot7:'g'}[m.split(':')[0]]||'');

    return{status:stale?'nodata':(cur>=g.lo&&cur<=g.hi)?'ontrack':'behind',cur,weeks};
  }

const STAT={achieved:'Achieved',ontrack:'On track',behind:'Behind',past:'Past deadline',nodata:'No recent data',open:'In progress'};

  const out=[],ids=new Set();S.sessions.forEach(s=>s.ex.forEach(e=>ids.add(e.exId)));

function lineChart(series,o={}){
  const all=series.flatMap(s=>s.pts); if(!all.length)return'<div class="empty">'+esc(o.empty||'Nothing logged yet.')+'</div>';
  const W=o.w||640,H=o.h||210,L=44,R=52,T=12,B=24;
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])); if(x0===x1){x0-=1;x1+=1}
  let y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  if(o.band){y0=Math.min(y0,o.band[0]);y1=Math.max(y1,o.band[1])} if(o.target!=null){y0=Math.min(y0,o.target);y1=Math.max(y1,o.target)}
  const pad=(y1-y0)*0.12||Math.max(1,Math.abs(y1)*0.05); y0-=pad;y1+=pad;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B),d=(y1-y0)<12?1:0;
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v,d)}</text>`}
  [[x0,'start'],[(x0+x1)/2,'middle'],[x1,'end']].forEach(a=>{g+=`<text x="${X(a[0])}" y="${H-6}" text-anchor="${a[1]}">${fd(dnIso(Math.round(a[0])))}</text>`});
  if(o.band)g+=`<rect class="band" x="${L}" width="${W-L-R}" y="${Y(o.band[1])}" height="${Y(o.band[0])-Y(o.band[1])}"/>`;
  if(o.target!=null)g+=`<line class="tg" x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}"/><text x="${W-R+4}" y="${Y(o.target)-4}">goal</text>`;
  series.forEach(s=>{
    if(s.dots)s.pts.forEach(p=>g+=`<circle class="da" cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5"/>`);
    else if(s.pts.length){
      const path=s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
      const a=s.pts[0],z=s.pts[s.pts.length-1];

      g+=`<path class="la" d="${path}"/><circle class="end" cx="${X(z[0])}" cy="${Y(z[1])}" r="5"/><text class="endt" x="${X(z[0])+8}" y="${Y(z[1])+4}">${fmt(z[1],o.dec==null?d:o.dec)}</text>`;
    }

  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}

  document.getElementById('banner').innerHTML=demo?`<div class="banner"><p><strong>Demo data.</strong> ${mode==='loading'?'Showing made-up numbers while your saved data loads.':'Every number here is made up, and changes you make are not saved.'}</p>${mode==='loading'?'':'<button class="pri" data-act="startOwn">Clear demo data and start my own</button>'}</div>`:'';
  document.getElementById('app').innerHTML={me:vHome,sections:vSections,log:vLog,progress:vProgress,body:vBody,food:vFood,goals:vGoals,setup:vSetup}[r]();
  paintSync();
}
const cur=()=>S.sessions.find(x=>x.id===ui.editId);
function newSession(date,rid,i){
  const s={id:uid('w'),date,start:date===today()?Date.now():null,end:null,ex:[],note:'',rating:''};
  const r=rid&&(S.custom.routines||[]).find(x=>x.id===rid);
  if(r&&r.days[i]){s.rd={rid,i:Number(i),name:r.days[i].name};
    r.days[i].items.forEach(it=>{const l=lastSets(it.exId),sets=[];for(let k=0;k<it.sets;k++){const q=l&&(l.sets[k]||l.sets[l.sets.length-1]);sets.push({w:q?q.w:0,r:q?q.r:0,rir:q&&q.rir!=null?q.rir:2,t:'s',done:false})}
      s.ex.push({exId:it.exId,plan:{sets:it.sets,reps:it.reps},sets})})}
  S.sessions.push(s);sortS();ui.editId=s.id;ui.restFrom=0;persist(sKey(s));location.hash='#log';render();
}
const num=v=>v===''||v==null?null:Number(v);
const ACT={
  start:d=>newSession(today(),d.rid,d.i),
  startPast:()=>{const v=document.getElementById('pastDate').value||today();newSession(v>today()?today():v)},
  edit:d=>{ui.editId=d.id;ui.restFrom=0;location.hash='#log';render()},
  addEx:()=>{const s=cur(),id=document.getElementById('addExSel').value,l=lastSets(id,s.id),q=l&&l.sets[0];s.ex.push({exId:id,sets:[{w:q?q.w:0,r:q?q.r:0,rir:2,t:'s',done:false}]});persist(sKey(s));render()},
  rmEx:d=>{const s=cur();s.ex.splice(d.ei,1);persist(sKey(s));render()},
  addSet:d=>{const s=cur(),e=s.ex[d.ei],q=e.sets[e.sets.length-1]||{w:0,r:0,rir:2};e.sets.push({w:q.w,r:q.r,rir:q.rir,t:'s',done:false});persist(sKey(s));render()},
  rmSet:d=>{const s=cur();s.ex[d.ei].sets.splice(d.si,1);persist(sKey(s));render()},
  cycle:d=>{const s=cur(),q=s.ex[d.ei].sets[d.si];q.t=q.t==='s'||!q.t?'w':q.t==='w'?'d':'s';persist(sKey(s));render()},
  done:d=>{const s=cur(),q=s.ex[d.ei].sets[d.si];q.done=q.done===false;if(q.done){q.ts=Date.now();ui.restFrom=q.ts}persist(sKey(s));render()},
  finish:()=>{const s=cur();s.ex.forEach(e=>e.sets=e.sets.filter(q=>q.done!==false));s.ex=s.ex.filter(e=>e.sets.length);if(s.start&&!s.end&&s.date===today())s.end=Date.now();
    if(s.rd){const r=(S.custom.routines||[]).find(x=>x.id===s.rd.rid);if(r&&r.days.length){S.meta.ptr=S.meta.ptr||{};S.meta.ptr[r.id]=(s.rd.i+1)%r.days.length;persist('meta')}}
    if(!s.ex.length){S.sessions=S.sessions.filter(x=>x.id!==s.id)}persist(sKey(s));ui.editId=null;location.hash='#me';render()},
  delSession:d=>{S.sessions=S.sessions.filter(x=>x.id!==d.id);persist('s-'+d.id);ui.editId=null;render()},
  allSessions:()=>{ui.allSessions=true;render()},
  delBody:d=>{delete S.body[d.id];persist('body');const f=S.food[d.id];if(f){delete f.kcal;if(!Object.keys(f).length)delete S.food[d.id];persist('food')}render()},
  pickDay:d=>{ui.bodyDate=d.id;ui.bodyMsg=null;render();window.scrollTo(0,0)},
  delFood:d=>{delete S.food[d.id];persist('food');render()},
  closeGoal:d=>{const g=S.goals.find(x=>x.id===d.id);g.outcome=d.out;g.closed=today();if(g.kind!=='habit')g.final=valueAt(g.metric,today());persist('goals');render()},
  delGoal:d=>{S.goals=S.goals.filter(x=>x.id!==d.id);persist('goals');render()},
  delRoutine:d=>{S.custom.routines=S.custom.routines.filter(r=>r.id!==d.id);persist('custom');render()},
  delDay:d=>{S.custom.routines.find(r=>r.id===d.id).days.splice(d.di,1);persist('custom');render()},
  delItem:d=>{S.custom.routines.find(r=>r.id===d.id).days[d.di].items.splice(d.ii,1);persist('custom');render()},
  archEx:d=>{S.custom.exercises.find(e=>e.id===d.id).archived=true;persist('custom');render()},
  export:async()=>{const txt=JSON.stringify({app:'gym-tracker',version:1,exported:new Date().toISOString(),data:S}),name='gym-tracker-backup-'+today()+'.json',file=new File([txt],name,{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Gym Tracker backup'});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
      S.meta.lastBackup=today();persist();ui.dataMsg='Backup file created. Keep it somewhere safe, such as iCloud Drive.'}
    catch(e){if(e&&e.name==='AbortError')return;ui.dataMsg='Could not create the backup file.'}render()},
  import:()=>{ui.dataMsg='';document.getElementById('imp').click()},
  applyImport:()=>applyImport(),
  cancelImport:()=>{ui.pendingImport=null;render()},
  startOwn:async()=>{await initDone;if(!demo)return;demo=false;const off=S.meta.off||{};S=blank();S.meta.off=off;S.meta.started=true;ui.editId=null;ui.exSel=null;ui.exportText='';persist('meta');render()},
  wipe:()=>{const off=S.meta.off||{};S=blank();S.meta.off=off;S.meta.started=true;ui.editId=null;ui.dataMsg='All data deleted.';persist();render()}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const d=el.dataset,key=d.act+':'+(d.id||'')+':'+(d.ei||'')+':'+(d.di||'');
  if('confirm' in d&&ui.confirm!==key){ui.confirm=key;el.textContent='Tap again to confirm';el.classList.add('danger');return}
  ui.confirm=null;ACT[d.act](d);
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.set||t.tagName==='SELECT')return;const a=t.dataset.set.split(','),s=cur();if(!s)return;
  s.ex[a[0]].sets[a[1]][a[2]]=Math.max(0,parseFloat(t.value)||0);
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset,s=cur();
  if(t.id==='imp'){const f=t.files&&t.files[0];if(!f)return;f.text().then(x=>{const o=JSON.parse(x),dt=o&&o.app==='gym-tracker'?o.data:o;if(!dt||!Array.isArray(dt.sessions))throw 0;ui.pendingImport=dt;ui.dataMsg='';render()}).catch(()=>{ui.dataMsg='That file is not a Gym Tracker backup.';render()});return}
  if(d.set&&s){const a=d.set.split(',');if(a[2]==='rir')s.ex[a[0]].sets[a[1]].rir=Number(t.value);persist(sKey(s));return}
  if(d.sfield&&s){if(d.sfield==='date'){if(t.value&&t.value<=today()){s.date=t.value;sortS()}}else s[d.sfield]=t.value;persist(sKey(s));return}
  if(d.sec){S.meta.off=S.meta.off||{};S.meta.off[d.sec]=!t.checked;persist('meta');render();return}
  if(d.ui){ui[d.ui]=d.ui==='cmp'?Number(t.value):t.value;if(d.ui==='bodyDate')ui.bodyMsg=null;render()}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,k=f.dataset.form,v=Object.fromEntries(new FormData(f).entries());
  if(k==='body'){
    if(v.w!=='')S.body[v.date]={w:Number(v.w)};else delete S.body[v.date];persist('body');
    const f=Object.assign({},S.food[v.date]);if(v.kcal!=='')f.kcal=Number(v.kcal);else delete f.kcal;
    if(Object.keys(f).length)S.food[v.date]=f;else delete S.food[v.date];persist('food');ui.bodyMsg=v.date}
  else if(k==='food'){const e=Object.assign({},S.food[v.date],{kcal:Number(v.kcal),p:Number(v.p)});if(v.c!=='')e.c=Number(v.c);if(v.f!=='')e.f=Number(v.f);S.food[v.date]=e;persist('food')}
  else if(k==='goal'){
    const t=v.type,metric=t+(v.arg?':'+v.arg:''),isVal=['e1rm','bw','meas','kcal7','prot7'].includes(t),kind=isVal?v.kind:'habit';
    const g={id:uid('g'),metric,kind,startDate:today()};
    if(kind==='reach'){const st=valueAt(metric,today());if(st==null){document.getElementById('goalMsg').textContent='Log this at least once first, so the goal has a starting value.';return}g.start=st;g.target=Number(v.target);if(v.deadline)g.deadline=v.deadline}
    else if(kind==='range'){g.lo=Math.min(Number(v.lo),Number(v.hi));g.hi=Math.max(Number(v.lo),Number(v.hi))}
    else g.target=Number(v.target);
    S.goals.push(g);persist('goals');
  }
  else if(k==='routine'){S.custom.routines=S.custom.routines||[];S.custom.routines.push({id:uid('r'),name:v.name.trim(),days:[]});persist('custom')}
  else if(k==='day'){S.custom.routines.find(r=>r.id===f.dataset.id).days.push({name:v.name.trim(),items:[]});persist('custom')}
  else if(k==='item'){S.custom.routines.find(r=>r.id===f.dataset.id).days[f.dataset.di].items.push({exId:v.exId,sets:Math.max(1,Number(v.sets)||1),reps:v.reps.trim()});persist('custom')}
  else if(k==='exercise'){S.custom.exercises=S.custom.exercises||[];S.custom.exercises.push({id:uid('c'),name:v.name.trim(),main:v.main,assist:[v.a1,v.a2].filter((a,i,arr)=>a&&a!==v.main&&arr.indexOf(a)===i)});persist('custom')}
  render();
});
window.addEventListener('hashchange',render);
setInterval(()=>{const el=document.getElementById('rest');if(!el)return;if(!ui.restFrom){el.textContent='–';return}const s=Math.floor((Date.now()-ui.restFrom)/1000);el.textContent=Math.floor(s/60)+':'+p2(s%60)},1000);

/* ---------- demo data (made up, never saved) ---------- */
function makeDemo(){
  let a=7;const R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const D=blank(),T=today(),start=addD(monday(T),-77);
  const plan={'Upper A':[['bench',65,8,4],['csrow',60,10,3],['incdb',24,10,3],['pulld',55,10,3],['latr',8,15,3],['pushd',25,12,3],['dbcurl',12,12,3]],
    'Lower A':[['squat',90,8,3],['rdl',80,10,3],['legp',160,12,3],['lcurl',40,12,3],['calf',60,12,4],['crunch',35,12,3]],
    'Upper B':[['ohp',40,8,3],['pulld',52.5,12,3],['mpress',60,12,3],['crow',55,10,3],['latr',8,15,3],['rfly',6,15,3],['ohext',20,12,3],['hcurl',14,12,3]],
    'Lower B':[['hack',80,10,3],['hip',90,10,3],['legx',45,15,3],['lcurl',40,12,3],['scalf',40,15,4],['legr',5,12,3]]};
  const names=Object.keys(plan),offs=[0,1,3,4];
  D.custom.routines=[{id:'demo-r',name:'Upper / Lower',days:names.map(n=>({name:n,items:plan[n].map(p=>({exId:p[0],sets:p[3],reps:(p[2]-2)+'-'+(p[2]+2)}))}))}];
  let lastI=0;
  for(let w=0;w<12;w++)offs.forEach((o,i)=>{
    const date=addD(start,w*7+o);if(date>T||R()<0.1)return;const st=pd(date).getTime()+18*36e5;lastI=i;
    D.sessions.push({id:'demo-'+w+'-'+i,date,start:st,end:st+(55+Math.round(R()*25))*6e4,rd:{rid:'demo-r',i,name:names[i]},rating:String(3+Math.round(R()*2)),note:'',
      ex:plan[names[i]].map(p=>{const step=p[1]<30?1:2.5,load=Math.round(p[1]*(1+0.012*w)/step)*step,sets=[];
        for(let k=0;k<p[3];k++)sets.push({w:load,r:Math.max(3,p[2]+Math.round(R()*2-1)-(k&&R()<0.5?1:0)-(k>1?1:0)),rir:Math.max(0,2-(k===p[3]-1?1:0)-(R()<0.3?1:0)),t:'s'});
        return{exId:p[0],sets}})});
  });
  D.meta.ptr={'demo-r':(lastI+1)%4};
  for(let i=0;i<=dn(T)-dn(start);i++){const d=addD(start,i);
    if(R()<0.72)D.body[d]={w:Math.round((73.8-0.005*i+Math.sin(i/3)*0.25+(R()-0.5)*0.7)*10)/10};
    if(R()<0.86)D.food[d]={kcal:Math.round((2450+(R()-0.5)*500)/10)*10,p:Math.round(136+(R()-0.5)*40),c:Math.round(285+(R()-0.5)*80),f:Math.round(76+(R()-0.5)*24)};
  }
  const keep=S;S=D;const gs=addD(T,-56);
  const b0=valueAt('e1rm:bench',gs)||85;S=keep;
  D.goals=[{id:'demo-g1',metric:'e1rm:bench',kind:'reach',start:b0,startDate:gs,target:100,deadline:addD(T,42)},
    {id:'demo-g2',metric:'bw',kind:'range',lo:72.5,hi:74.5,startDate:gs},
    {id:'demo-g3',metric:'sessions',kind:'habit',target:4,startDate:gs},
    {id:'demo-g4',metric:'protdays:130',kind:'habit',target:6,startDate:gs}];
  return D;
}
S=makeDemo();render();initDone=init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
